<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책은내친구">

<title>📚 책은 내 친구</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%;max-width:100vw}
:root{
  --org:#FF8C42;--org-l:#FFF0E6;
  --grn:#4CAF50;--grn-l:#E8F5E9;
  --blu:#2196F3;--blu-l:#E3F2FD;
  --yel:#FFC107;--yel-l:#FFFDE7;
  --pur:#9C27B0;--pur-l:#F3E5F5;
  --gy:#9E9E9E;--gy-l:#F5F5F5;
  --txt:#1A1A1A;--mut:#666;
  --bdr:#E0E0E0;--bg:#FFF8F3;
  --r:16px;--sh:0 2px 12px rgba(0,0,0,.09)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px;font-size:22px}

/* 모드 선택 */
.mode-screen{position:fixed;inset:0;background:linear-gradient(160deg,#FF8C42,#FF6B35);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:32px 20px}
.mode-logo{font-size:84px;margin-bottom:16px}
.mode-title{font-size:34px;font-weight:700;color:#fff;margin-bottom:10px}
.mode-sub{font-size:19px;color:rgba(255,255,255,.9);margin-bottom:44px;text-align:center}
.mode-btns{display:flex;flex-direction:column;gap:18px;width:100%;max-width:360px}
.mode-btn{padding:28px 20px;border:none;border-radius:22px;cursor:pointer;display:flex;align-items:center;gap:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:transform .15s}
.mode-btn:active{transform:scale(.97)}
.mode-btn-parent{background:#fff}
.mode-btn-child{background:linear-gradient(135deg,#FFE57F,#FFB300)}
.mode-btn-icon{font-size:54px;flex-shrink:0}
.mode-btn-label strong{display:block;font-size:26px;font-weight:700;color:var(--txt)}
.mode-btn-label span{font-size:18px;color:var(--mut);margin-top:4px;display:block}
.mode-btn-child .mode-btn-label strong{color:#4E342E}
.mode-btn-child .mode-btn-label span{color:#6D4C41}

/* 헤더 */
.header{padding:16px 16px 12px;text-align:center;position:sticky;top:0;z-index:100}
.hdr-parent{background:linear-gradient(135deg,#FF8C42,#FF6B35);box-shadow:0 2px 16px rgba(255,107,53,.3)}
.hdr-child{background:linear-gradient(135deg,#FFD54F,#FFB300);box-shadow:0 2px 16px rgba(255,179,0,.3)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hdr-title{font-size:26px;font-weight:700;color:#fff;flex:1;text-align:center;letter-spacing:-.3px}
.hdr-sub{font-size:17px;color:rgba(255,255,255,.9);text-align:center;margin-bottom:7px}
.mode-switch{background:rgba(255,255,255,.25);border:none;color:#fff;font-size:18px;font-weight:500;padding:7px 14px;border-radius:100px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}
.sync-row{display:flex;align-items:center;justify-content:center;gap:7px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5}
.sync-dot.ok{background:#90EE90;opacity:1}
.sync-dot.live{background:#90EE90;opacity:1;animation:livepulse 2s infinite}
.sync-dot.error{background:#FF6B6B;opacity:1}
.sync-txt{font-size:14px;color:rgba(255,255,255,.9)}
.sync-btn{background:rgba(255,255,255,.22);border:none;color:#fff;font-size:14px;padding:4px 12px;border-radius:100px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 요약 */
.summary{background:#fff;margin:14px 14px 0;border-radius:var(--r);padding:14px 12px;box-shadow:var(--sh)}
.sum-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.sc{text-align:center;background:var(--gy-l);border-radius:10px;padding:10px 2px}
.sc .n{font-size:24px;font-weight:700;line-height:1.2}
.sc .l{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.3}
.sc.total .n{color:var(--org)}
.sc.borrow .n{color:#F57F17}
.sc.buy .n{color:var(--pur)}
.sc.rdg .n{color:var(--blu)}
.sc.dn .n{color:var(--grn)}
.pbar{background:#EBEBEB;border-radius:100px;height:10px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#66BB6A);border-radius:100px;transition:width .5s}
.pbar-lbl{font-size:18px;color:var(--mut);margin-top:6px;text-align:right;font-weight:500}

/* 탭 */
.tabs{display:flex;gap:5px;padding:12px 14px 0;width:100%}
.tb{flex:1;min-width:0;padding:11px 2px;border:2px solid var(--bdr);background:#fff;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;color:var(--mut);transition:all .2s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.active{color:#fff;font-weight:700}
.parent-mode .tb.active{background:var(--org);border-color:var(--org)}
.child-mode .tb.active{background:#FFB300;border-color:#FFB300;color:#4E342E}
.tb.stat-tab.active{background:#3F51B5;border-color:#3F51B5;color:#fff}

/* 범례 */
.legend{display:flex;gap:10px;padding:10px 14px 3px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:17px;color:var(--mut)}
.leg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}

/* 부모님 카드 */
.book-list{padding:8px 14px;display:flex;flex-direction:column;gap:12px}
.bk{background:#fff;border-radius:var(--r);padding:16px 14px;box-shadow:var(--sh);border-left:6px solid var(--bdr)}
.bk.s-done{border-left-color:var(--grn)}
.bk.s-rdg{border-left-color:var(--blu)}
.bk-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.bk-num{width:34px;height:34px;border-radius:50%;background:var(--org-l);color:var(--org);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.bk-info{flex:1;min-width:0}
.bk-title{font-size:22px;font-weight:700;line-height:1.45;color:var(--txt)}
.bk-sub{font-size:17px;color:var(--mut);margin-top:4px}
.bk-cat{font-size:16px;padding:4px 10px;border-radius:100px;background:var(--gy-l);color:var(--mut);flex-shrink:0;margin-top:2px;height:fit-content;font-weight:500}
.ctrl-row{display:flex;gap:8px;align-items:center}
.ctrl{flex:1;min-width:0}
.ctrl-lbl{font-size:17px;font-weight:700;color:var(--mut);margin-bottom:6px}
.btns{display:flex;gap:4px}
.btn{flex:1;padding:13px 2px;border:2px solid var(--bdr);background:#fff;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:'Noto Sans KR',sans-serif;color:var(--mut);min-height:48px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.btn:active{transform:scale(.94)}
.btn.lb.active{background:var(--yel-l);border-color:var(--yel);color:#E65100;font-weight:700}
.btn.lr.active{background:var(--blu-l);border-color:var(--blu);color:#0D47A1;font-weight:700}
.btn.lp.active{background:var(--pur-l);border-color:var(--pur);color:#4A148C;font-weight:700}
.btn.rn.active{background:#F0F0F0;border-color:#BDBDBD;color:#757575;font-weight:700}
.btn.ri.active{background:var(--blu-l);border-color:var(--blu);color:#0D47A1;font-weight:700}
.btn.rd.active{background:var(--grn-l);border-color:var(--grn);color:#1B5E20;font-weight:700}
.dvdr{width:1px;height:54px;background:var(--bdr);flex-shrink:0}

/* 아이 카드 */
.kid-list{padding:8px 14px;display:flex;flex-direction:column;gap:14px}
.kd{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:var(--sh);border-left:7px solid var(--bdr)}
.kd.k-done{border-left-color:var(--grn);background:linear-gradient(135deg,#fff 60%,#F1F8E9)}
.kd.k-rdg{border-left-color:var(--blu);background:linear-gradient(135deg,#fff 60%,#E8F4FD)}
.kd-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.kd-num{width:44px;height:44px;border-radius:50%;background:var(--yel-l);color:#E65100;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid var(--yel)}
.kd-info{flex:1;min-width:0}
.kd-title{font-size:24px;font-weight:700;line-height:1.4;color:var(--txt)}
.kd-cat{font-size:18px;color:var(--mut);margin-top:4px}
.kd-lib{font-size:15px;padding:5px 13px;border-radius:100px;font-weight:700;flex-shrink:0;white-space:nowrap}
.kd-lib.nl{background:var(--gy-l);color:var(--gy)}
.kd-lib.bo{background:var(--yel-l);color:#E65100}
.kd-lib.re{background:var(--blu-l);color:#0D47A1}
.kd-lib.bu{background:var(--pur-l);color:#4A148C}
.kd-btns{display:flex;gap:12px}
.kd-btn{flex:1;padding:20px 6px;border:2.5px solid var(--bdr);background:#fff;border-radius:18px;font-size:20px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;color:var(--mut);transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:88px;justify-content:center}
.kd-btn:active{transform:scale(.94)}
.kd-btn .ke{font-size:36px;line-height:1}
.kd-btn.kn.active{background:#F0F0F0;border-color:#BDBDBD;color:#757575}
.kd-btn.ki.active{background:var(--blu-l);border-color:var(--blu);color:#0D47A1}
.kd-btn.kd2.active{background:var(--grn-l);border-color:var(--grn);color:#1B5E20}

/* 통계 */
.stat-wrap{padding:12px 14px}
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.split-box{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--sh)}
.split-badge{font-size:17px;padding:4px 12px;border-radius:100px;font-weight:700;display:inline-block;margin-bottom:8px}
.sel-b{background:var(--org-l);color:var(--org)}
.rec-b{background:var(--grn-l);color:#2E7D32}
.mpbar{background:#EBEBEB;border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.mpbar-fill{height:100%;border-radius:100px;transition:width .4s}
.split-pct{font-size:17px;color:var(--mut);text-align:right;margin-bottom:8px;font-weight:500}
.split-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.ssn{text-align:center}
.ssn .sv{font-size:22px;font-weight:700;line-height:1.2}
.ssn .sl{font-size:15px;color:var(--mut);margin-top:2px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat-box{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--sh)}
.stat-box-title{font-size:17px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.bar-lbl{font-size:16px;color:var(--mut);width:52px;flex-shrink:0}
.bar-track{flex:1;height:10px;background:#EBEBEB;border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;transition:width .4s}
.bar-val{font-size:17px;font-weight:700;min-width:30px;text-align:right}
.csv-btn{width:100%;padding:16px;background:#3F51B5;color:#fff;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:4px}

/* 완독 기록 */
.done-section{background:#fff;border-radius:14px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.done-section-title{font-size:17px;font-weight:700;color:var(--mut);padding:14px 16px 10px;border-bottom:1px solid var(--bdr)}
.done-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #F5F5F5}
.done-row:last-child{border-bottom:none}
.done-emoji{font-size:22px;flex-shrink:0}
.done-info{flex:1;min-width:0}
.done-title{font-size:17px;font-weight:700;color:var(--txt);line-height:1.4}
.done-meta{font-size:13px;color:var(--mut);margin-top:2px}
.done-date{font-size:15px;font-weight:700;color:var(--grn);flex-shrink:0;text-align:right;white-space:nowrap}
.done-empty{text-align:center;padding:28px 16px;font-size:17px;color:var(--mut);line-height:1.8}

/* 토스트 & 축하 */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1A1A1A;color:#fff;padding:14px 26px;border-radius:100px;font-size:19px;font-weight:500;transition:transform .3s;z-index:9997;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.28)}
.toast.show{transform:translateX(-50%) translateY(0)}
.cheer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9996;opacity:0;pointer-events:none;transition:opacity .3s}
.cheer-bg.show{opacity:1;pointer-events:auto}
.cheer-box{background:#fff;border-radius:28px;padding:40px 36px;text-align:center;box-shadow:0 10px 48px rgba(0,0,0,.22);max-width:300px;width:90%}
.cheer-emoji{font-size:84px;margin-bottom:14px;display:block}
.cheer-title{font-size:30px;font-weight:700;color:var(--txt);margin-bottom:8px}
.cheer-book{font-size:21px;color:var(--mut);margin-bottom:24px;line-height:1.5}
.cheer-close{padding:16px 44px;background:var(--grn);color:#fff;border:none;border-radius:14px;font-size:22px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
</style>
</head>

// ── 상태 ──────────────────────────────────────────────────────
var stateMap = {};
var mode = 'parent';
var curTab = 'selected';

// ── Firebase 실시간 리스너 ────────────────────────────────────
function startFirebaseListener() {
  setSyncStatus('syncing', '연결 중...');
  db.ref('status').on('value',
    function(snapshot) {
      var data = snapshot.val() || {};
      stateMap = {};
      Object.keys(data).forEach(function(id) {
        stateMap[id] = data[id];
      });
      updateSummary();
      render();
      setSyncStatus('live', '실시간 연결됨 ✅');
    },
    function(err) {
      setSyncStatus('error', '연결 실패: ' + err.message);
    }
  );
}

function manualSync() {
  setSyncStatus('syncing', '새로고침 중...');
  db.ref('status').once('value')
    .then(function(snapshot) {
      var data = snapshot.val() || {};
      stateMap = {};
      Object.keys(data).forEach(function(id) {
        stateMap[id] = data[id];
      });
      updateSummary();
      render();
      setSyncStatus('live', '실시간 연결됨 ✅');
    });
}

// ── 모드 시작 ─────────────────────────────────────────────────
function startMode(m) {
  mode = m;
  document.getElementById('mode-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  applyModeStyle();
  buildTabs();
  render();
  startFirebaseListener();
}

function changeMode() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('mode-screen').style.display = 'flex';
  db.ref('status').off(); // 리스너 해제
}

function applyModeStyle() {
  var hdr = document.getElementById('hdr');
  var app = document.getElementById('app');
  if (mode === 'parent') {
    hdr.className = 'header hdr-parent'; app.className = 'parent-mode';
    document.getElementById('hdr-title').textContent = '📚 부모님 관리 모드';
    document.getElementById('hdr-sub').textContent = '도서관 대출·구매 상태를 관리하세요';
  } else {
    hdr.className = 'header hdr-child'; app.className = 'child-mode';
    document.getElementById('hdr-title').textContent = '📖 내 독서 기록';
    document.getElementById('hdr-sub').textContent = '읽은 책을 체크해봐요! 🌟';
  }
}

function buildTabs() {
  var defs = [
    {id:'selected',    lbl:'⭐ 선정 (13)'},
    {id:'recommended', lbl:'📖 권장 (60)'},
    {id:'stat',        lbl:'📊 통계', ex:'stat-tab'}
  ];
  document.getElementById('tabs').innerHTML = defs.map(function(t) {
    var c = 'tb' + (t.id === curTab ? ' active' : '') + (t.ex ? ' '+t.ex : '');
    return '<button class="'+c+'" onclick="goTab(\''+t.id+'\')">'+t.lbl+'</button>';
  }).join('');
}
function goTab(t) { curTab = t; buildTabs(); render(); }

// ── 상태 변경 → Firebase에 저장 ──────────────────────────────
function gs(id) { return stateMap[id] || {lib:'none', read:'none', done_date:''}; }

function setLib(id, val) {
  var s = gs(id);
  s.lib = (s.lib === val) ? 'none' : val;
  var lbl = {borrowed:'📚 대출 중!', returned:'🔵 반납 완료!', purchased:'🛒 구매 완료!'};
  showToast(s.lib === 'none' ? '상태 초기화' : lbl[val]);
  db.ref('status/' + id).update({lib: s.lib});
}

function setRead(id, val) {
  var s = gs(id);
  s.read = (s.read === val) ? 'none' : val;
  if (s.read === 'done') {
    var today = new Date();
    s.done_date = today.getFullYear() + '-'
      + String(today.getMonth()+1).padStart(2,'0') + '-'
      + String(today.getDate()).padStart(2,'0');
    showCheer(BOOKS.find(function(b){return b.id===id;}).title);
  } else {
    s.done_date = '';
    showToast(s.read === 'reading' ? '📖 지금 읽는 중!' : '상태 초기화');
  }
  db.ref('status/' + id).update({read: s.read, done_date: s.done_date || ''});
}

// ── 요약 ──────────────────────────────────────────────────────
function updateSummary() {
  var bor=0, buy=0, rdg=0, dn=0;
  BOOKS.forEach(function(b) {
    var s = gs(b.id);
    if (s.lib === 'borrowed')  bor++;
    if (s.lib === 'purchased') buy++;
    if (s.read === 'reading')  rdg++;
    if (s.read === 'done')     dn++;
  });
  var tot = BOOKS.length;
  document.getElementById('s-tot').textContent = tot;
  document.getElementById('s-bor').textContent = bor;
  document.getElementById('s-buy').textContent = buy;
  document.getElementById('s-rdg').textContent = rdg;
  document.getElementById('s-dn').textContent  = dn;
  var pct = Math.round(dn / tot * 100);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('pbar-lbl').textContent = '완독 ' + pct + '% (' + dn + '/' + tot + '권)';
}

// ── 렌더 분기 ────────────────────────────────────────────────
function render() {
  var leg = document.getElementById('legend');
  if (curTab === 'stat') { leg.style.display = 'none'; renderStat(); return; }
  var items = mode === 'parent'
    ? [['#FFC107','대출중'],['#9C27B0','구매완료'],['#2196F3','읽는중'],['#4CAF50','완독']]
    : [['#FFC107','대출중'],['#9C27B0','구매완료'],['#4CAF50','완독🎉']];
  leg.style.display = 'flex';
  leg.innerHTML = items.map(function(i) {
    return '<div class="leg"><div class="leg-dot" style="background:'+i[0]+'"></div>'+i[1]+'</div>';
  }).join('');
  if (mode === 'parent') renderParent(); else renderChild();
}

      +pb('lr',lib==='returned', "setLib('"+b.id+"','returned')",  '반납완료')

      +'</div></div><div class="dvdr"></div>'

      +pb('rd',rd==='done',   "setRead('"+b.id+"','done')",    '완독!')
      +'</div></div></div></div>';
  });
  document.getElementById('main').innerHTML = h + '</div>';

function pb(cls, active, oc, lbl) {
  return '<button class="btn '+cls+(active?' active':'')+'" onclick="'+oc+'">'+lbl+'</button>';
}

// ── 아이 렌더 ────────────────────────────────────────────────
function renderChild() {

// ── 통계 렌더 ────────────────────────────────────────────────
function renderStat() {
  var sel=BOOKS.filter(function(b){return b.type==='선정';}),
      rec=BOOKS.filter(function(b){return b.type==='권장';}),
      tot=BOOKS.length;
  var bor=0,ret=0,buy=0,nlib=0,rdg=0,dn=0;
  BOOKS.forEach(function(b){
    var s=gs(b.id);
    if(s.lib==='borrowed')bor++;else if(s.lib==='returned')ret++;else if(s.lib==='purchased')buy++;else nlib++;
    if(s.read==='reading')rdg++;else if(s.read==='done')dn++;
  });
  function tstat(arr){
    var r=0,d=0,bl=0,by=0;
    arr.forEach(function(b){var s=gs(b.id);
      if(s.read==='reading')r++;else if(s.read==='done')d++;
      if(s.lib==='borrowed')bl++;else if(s.lib==='purchased')by++;});
    return{total:arr.length,rdg:r,done:d,bor:bl,buy:by};
  }
  var ss=tstat(sel),sr=tstat(rec);
  var catMap={};
  BOOKS.forEach(function(b){
    if(!catMap[b.cat])catMap[b.cat]={d:0,t:0};
    catMap[b.cat].t++;
    if(gs(b.id).read==='done')catMap[b.cat].d++;
  });
  var catC={'문학':'#FF8C42','과학':'#2196F3','수학':'#9C27B0','사회':'#4CAF50','인물':'#F44336'};
  function splitBox(lbl,bcls,st,col){
    var pct=st.total>0?Math.round(st.done/st.total*100):0;
    return '<div class="split-box">'
      +'<span class="split-badge '+bcls+'">'+lbl+'</span>'
      +'<div class="mpbar"><div class="mpbar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'
      +'<div class="split-pct">완독 '+pct+'% ('+st.done+'/'+st.total+')</div>'
      +'<div class="split-stats">'
      +'<div class="ssn"><div class="sv" style="color:#4CAF50">'+st.done+'</div><div class="sl">완독</div></div>'
      +'<div class="ssn"><div class="sv" style="color:#2196F3">'+st.rdg+'</div><div class="sl">읽는중</div></div>'
      +'<div class="ssn"><div class="sv" style="color:#9C27B0">'+st.buy+'</div><div class="sl">구매</div></div>'
      +'<div class="ssn"><div class="sv" style="color:#F57F17">'+st.bor+'</div><div class="sl">대출중</div></div>'
      +'</div></div>';
  }
  var catH=Object.keys(catMap).map(function(c){
    var v=catMap[c],pct=v.t>0?Math.round(v.d/v.t*100):0,col=catC[c]||'#999';
    return '<div class="bar-row"><div class="bar-lbl">'+c+'</div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'
      +'<div class="bar-val" style="color:'+col+'">'+v.d+'/'+v.t+'</div></div>';
  }).join('');
  var libH=[{l:'대출중',v:bor,c:'#FFC107',t:'#E65100'},{l:'반납완료',v:ret,c:'#2196F3',t:'#0D47A1'},{l:'구매완료',v:buy,c:'#9C27B0',t:'#4A148C'},{l:'미확보',v:nlib,c:'#E0E0E0',t:'#9E9E9E'}]
    .map(function(x){var p=tot>0?Math.round(x.v/tot*100):0;
      return '<div class="bar-row"><div class="bar-lbl">'+x.l+'</div>'
        +'<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+x.c+'"></div></div>'
        +'<div class="bar-val" style="color:'+x.t+'">'+x.v+'</div></div>';}).join('');

  var doneList=BOOKS.filter(function(b){return gs(b.id).read==='done';})
    .sort(function(a,b){return (gs(b.id).done_date||'').localeCompare(gs(a.id).done_date||'');});
  var doneRows=doneList.length>0
    ?doneList.map(function(b){var s=gs(b.id);
      return '<div class="done-row"><span class="done-emoji">🏆</span>'
        +'<div class="done-info"><div class="done-title">'+b.title+'</div>'
        +'<div class="done-meta">'+b.type+' · '+b.cat+'</div></div>'
        +'<div class="done-date">'+(s.done_date||'날짜 미기록')+'</div></div>';}).join('')
    :'<div class="done-empty">아직 완독한 책이 없어요<br>📖 열심히 읽어봐요!</div>';
  var doneSection='<div class="done-section">'
    +'<div class="done-section-title">🏆 완독 기록 ('+doneList.length+'권)</div>'
    +doneRows+'</div>';

  var csvBtn=mode==='parent'?'<button class="csv-btn" onclick="exportCSV()">📊 CSV 내보내기</button>':'';
  document.getElementById('main').innerHTML=
    '<div class="stat-wrap">'
    +'<div class="split-grid">'+splitBox('⭐ 선정도서','sel-b',ss,'#FF8C42')+splitBox('📖 권장도서','rec-b',sr,'#4CAF50')+'</div>'
    +'<div class="stat-grid"><div class="stat-box"><div class="stat-box-title">분류별 완독</div>'+catH+'</div>'
    +'<div class="stat-box"><div class="stat-box-title">도서 확보 현황</div>'+libH+'</div></div>'
    +doneSection+csvBtn+'</div>';
}

// ── CSV ───────────────────────────────────────────────────────
function exportCSV(){
  var ll={borrowed:'대출중',returned:'반납완료',purchased:'구매완료',none:'미확보'};
  var rl={reading:'읽는중',done:'완독',none:'안읽음'};
  var hdr=['ID','구분','제목','분류','도서확보','읽기상태','완독일'];
  var rows=BOOKS.map(function(b){var s=gs(b.id);
    return[b.id,b.type,b.title,b.cat,ll[s.lib||'none'],rl[s.read||'none'],s.done_date||''];});
  var csv=[hdr].concat(rows).map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='독서현황_리라초4학년.csv';a.click();
  URL.revokeObjectURL(url);
  showToast('📊 CSV 다운로드 완료!');
}

// ── 완독 축하 ─────────────────────────────────────────────────
function showCheer(title){
  document.getElementById('cheer-book').textContent='「'+title+'」 완독!\n정말 대단해요! 👏';
  document.getElementById('cheer-bg').className='cheer-bg show';
}
function closeCheer(){
  document.getElementById('cheer-bg').className='cheer-bg';
  showToast('🏆 완독 기록 저장!');
}

// ── 유틸 ─────────────────────────────────────────────────────
function setSyncStatus(status,msg){
  var dot=document.getElementById('sync-dot'),txt=document.getElementById('sync-txt');
  if(!dot||!txt)return;
  dot.className='sync-dot '+status;
  txt.textContent=msg;
}
var _tt;
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},2300);
}
</script>
